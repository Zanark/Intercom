name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows prototype
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CI: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        id: build
        run: npm run build
      - name: Renderer and domain tests
        run: npm test
      - name: Native voice tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:voice
      - name: Mesh and work host tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:host
      - name: Disposable Electron desktop tests
        id: desktop
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:desktop
      - name: Upload synthetic desktop failure evidence
        if: failure() && steps.desktop.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-desktop-failures-${{ github.run_attempt }}
          path: .local/desktop-test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
